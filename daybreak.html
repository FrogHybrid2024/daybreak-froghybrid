<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybreak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One visual world: a dark gallery room around lit surfaces, single theme by choice.
   Preview: the wall on top, the two tables below, a test control. Surface mode: one canvas fills the window. */
:root {
  --bg: #0e1214;
  --fg: #e8e2d2;
  --muted: #7d8a8c;
  --line: #243034;
  --accent: #ccff00;
  --font: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 13px/1.5 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
}
body.surface { padding: 0; overflow: hidden; background: #000; }
.stage { max-width: 1500px; margin: 0 auto; display: grid; gap: 14px; }
.head, .controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; color: var(--muted); }
.head b { color: var(--fg); font-weight: 500; letter-spacing: .04em; }
.box { display: grid; gap: 6px; min-width: 0; }
.label { color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.label a { color: var(--fg); }
.frame { position: relative; border: 1px solid var(--line); background: #000; max-width: 100%; }
.frame canvas { position: absolute; inset: 0; }
.frame.wall { aspect-ratio: 4 / 1; }
.frame.table { aspect-ratio: 1 / 1; }
.tables { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
canvas { display: block; width: 100%; height: 100%; }
body.surface canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; }
button { font: inherit; color: #0e1214; background: var(--accent); border: 0; padding: 8px 14px; cursor: pointer; letter-spacing: .04em; }
[hidden] { display: none !important; }   /* the preview is really gone on the show links (QA, 29 Oct 2026) */
button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.note { color: var(--muted); max-width: 72ch; margin: 0; }
/* the finished piece: no page around the work */
html, body { margin: 0; } body { padding: 0; background: #000; overflow: hidden; display: grid; place-items: center; }
.stage { width: min(100vw, calc(100vh * 4 / 3)); max-width: none; margin: 0; gap: 0; }
.tables { gap: 0; } .frame { border: 0; }
</style>

<div id="preview" class="stage">
  <div class="frame wall"><canvas id="c-wall"></canvas></div>
  <div class="tables"><div class="frame table"><canvas id="c-t1"></canvas></div><div class="frame table"><canvas id="c-t2"></canvas></div></div>
</div>
